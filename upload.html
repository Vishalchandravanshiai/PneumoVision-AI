<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PneumoVision AI - Upload X-ray</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Your CSS -->
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

<div class="container-fluid">
<div class="row">

    <!-- Sidebar -->
    <div class="col-md-2 bg-dark text-white min-vh-100 p-3">

        <h3 class="text-center mb-4">
            <i class="fa-solid fa-lungs"></i>
            PneumoVision
        </h3>

        <a href="dashboard.html" class="btn btn-dark w-100 text-start mb-2">
            <i class="fa-solid fa-house"></i>
            Dashboard
        </a>

        <a href="upload.html" class="btn btn-primary w-100 text-start mb-2">
            <i class="fa-solid fa-upload"></i>
            Upload X-ray
        </a>

        <a href="prediction.html" class="btn btn-dark w-100 text-start mb-2">
            <i class="fa-solid fa-brain"></i>
            Prediction
        </a>

        <a href="reports.html" class="btn btn-dark w-100 text-start mb-2">
            <i class="fa-solid fa-file-medical"></i>
            Reports
        </a>

        <a href="analytics.html" class="btn btn-dark w-100 text-start mb-2">
            <i class="fa-solid fa-chart-line"></i>
            Analytics
        </a>

        <a href="settings.html" class="btn btn-dark w-100 text-start">
            <i class="fa-solid fa-gear"></i>
            Settings
        </a>

    </div>

    <!-- Main Content -->
    <div class="col-md-10 p-4">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>
                <i class="fa-solid fa-upload text-primary"></i>
                Upload Chest X-ray
            </h2>

            <a href="dashboard.html" class="btn btn-outline-primary">
                <i class="fa-solid fa-arrow-left"></i>
                Dashboard
            </a>
        </div>

        <div class="row">

            <!-- Upload Card -->
            <div class="col-lg-7">

                <div class="card shadow border-0">

                    <div class="card-header bg-primary text-white">
                        Upload Image
                    </div>

                    <div class="card-body text-center">

                        <div class="border rounded p-5 mb-4">

                            <i class="fa-solid fa-cloud-arrow-up fa-5x text-primary mb-3"></i>

                            <h4>Drag & Drop Chest X-ray</h4>

                            <p class="text-muted">
                                PNG, JPG or JPEG
                            </p>

                            <input
                                type="file"
                                class="form-control"
                                id="imageInput"
                                accept="image/*">

                        </div>

                        <img
                            id="preview"
                            src=""
                            class="img-fluid rounded shadow"
                            style="display:none; max-height:350px;">

                    </div>

                </div>

            </div>

            <!-- Patient Details -->
            <div class="col-lg-5">

                <div class="card shadow border-0">

                    <div class="card-header bg-success text-white">
                        Patient Information
                    </div>

                    <div class="card-body">

                        <div class="mb-3">
                            <label>Name</label>
                            <input type="text" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label>Age</label>
                            <input type="number" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label>Gender</label>
                            <select class="form-select">
                                <option>Male</option>
                                <option>Female</option>
                                <option>Other</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label>Patient ID</label>
                            <input type="text" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label>Doctor Name</label>
                            <input type="text" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label>Hospital</label>
                            <input type="text" class="form-control">
                        </div>

                        <button class="btn btn-primary w-100 mt-3">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            Analyze X-ray
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
</div>

<script>
const imageInput = document.getElementById("imageInput");
const preview = document.getElementById("preview");

imageInput.addEventListener("change", function(){

    const file = this.files[0];

    if(file){

        preview.src = URL.createObjectURL(file);

        preview.style.display = "block";
    }

});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
