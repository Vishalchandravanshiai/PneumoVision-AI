<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PneumoVision AI Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#07111F;
color:white;
display:flex;
}

/* Sidebar */

.sidebar{
width:250px;
height:100vh;
background:#0C1B2F;
position:fixed;
left:0;
top:0;
padding:25px;
}

.logo{
font-size:24px;
font-weight:700;
color:#1E88E5;
margin-bottom:40px;
}

.sidebar ul{
list-style:none;
}

.sidebar ul li{
margin:18px 0;
}

.sidebar ul li a{
text-decoration:none;
color:white;
display:flex;
align-items:center;
gap:12px;
padding:12px 15px;
border-radius:12px;
transition:.3s;
}

.sidebar ul li a:hover,
.sidebar ul li a.active{
background:#1E88E5;
}

/* Main */

.main{
margin-left:250px;
width:calc(100% - 250px);
padding:30px;
}

/* Navbar */

.navbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:35px;
}

.search-box{
background:#13253F;
padding:12px 18px;
border-radius:12px;
width:320px;
display:flex;
align-items:center;
}

.search-box input{
background:none;
border:none;
outline:none;
color:white;
width:100%;
margin-left:10px;
}

.profile{
display:flex;
align-items:center;
gap:20px;
}

.profile img{
width:45px;
height:45px;
border-radius:50%;
}

/* Heading */

.heading h1{
font-size:30px;
}

.heading p{
color:#9EB4D0;
margin-top:5px;
}

/* Statistics */

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
margin-top:35px;
}

.card{
background:#10233E;
padding:22px;
border-radius:18px;
transition:.3s;
}

.card:hover{
transform:translateY(-6px);
box-shadow:0 15px 35px rgba(0,0,0,.35);
}

.card-top{
display:flex;
justify-content:space-between;
align-items:center;
}

.icon{
width:55px;
height:55px;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:22px;
}

.blue{background:#1E88E5;}
.green{background:#2ECC71;}
.red{background:#E74C3C;}
.orange{background:#F39C12;}

.card h2{
margin-top:18px;
font-size:34px;
}

.card p{
margin-top:6px;
color:#AFC6E4;
}

.growth{
margin-top:10px;
font-size:14px;
color:#2ECC71;
}
/* ===== AI Analysis Section ===== */

.analysis-grid{
    display:grid;
    grid-template-columns:2fr 2fr 1.5fr;
    gap:20px;
    margin-top:35px;
}

.panel{
    background:#10233E;
    border-radius:18px;
    padding:20px;
}

.panel h3{
    margin-bottom:15px;
    font-size:20px;
}

.image-box{
    height:340px;
    background:#0B1628;
    border:2px dashed #1E88E5;
    border-radius:15px;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#8FAED6;
    font-size:18px;
}

.prediction-card{
    background:#10233E;
    border-radius:18px;
    padding:20px;
}

.status{
    display:inline-block;
    background:#E74C3C;
    padding:8px 18px;
    border-radius:30px;
    font-weight:600;
    margin:15px 0;
}

.confidence{
    margin-top:20px;
}

.progress{
    width:100%;
    height:12px;
    background:#223857;
    border-radius:20px;
    overflow:hidden;
    margin-top:10px;
}

.progress div{
    width:96.8%;
    height:100%;
    background:#2ECC71;
}

.patient-info{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
    margin-top:20px;
}

.info-box{
    background:#0B1628;
    padding:15px;
    border-radius:12px;
}

.info-box span{
    color:#8FAED6;
    font-size:14px;
}

.info-box h4{
    margin-top:6px;
}

</style>
</head>

<body>

<!-- Sidebar -->

<div class="sidebar">

<div class="logo">
<i class="fa-solid fa-heart-pulse"></i>
PneumoVision
</div>

<ul>

<li>
<a class="active" href="#">
<i class="fa-solid fa-house"></i>
Dashboard
</a>
</li>

<li>
<a href="#">
<i class="fa-solid fa-upload"></i>
Upload X-ray
</a>
</li>

<li>
<a href="#">
<i class="fa-solid fa-brain"></i>
Prediction
</a>
</li>

<li>
<a href="#">
<i class="fa-solid fa-file-medical"></i>
Reports
</a>
</li>

<li>
<a href="#">
<i class="fa-solid fa-chart-line"></i>
Analytics
</a>
</li>

<li>
<a href="#">
<i class="fa-solid fa-user-group"></i>
Patients
</a>
</li>

<li>
<a href="#">
<i class="fa-solid fa-gear"></i>
Settings
</a>
</li>

</ul>

</div>

<!-- Main -->

<div class="main">

<div class="navbar">

<div class="search-box">
<i class="fa-solid fa-magnifying-glass"></i>
<input type="text" placeholder="Search patient...">
</div>

<div class="profile">

<i class="fa-regular fa-bell fa-xl"></i>

<img src="https://i.pravatar.cc/100" alt="Doctor">

</div>

</div>

<div class="heading">

<h1>AI Healthcare Dashboard</h1>

<p>Welcome back, Doctor 👋</p>

</div>

<div class="stats">

<div class="card">

<div class="card-top">
<div class="icon blue">
<i class="fa-solid fa-x-ray"></i>
</div>
</div>

<h2>1,254</h2>

<p>Total Scans</p>

<div class="growth">
+12% This Month
</div>

</div>

<div class="card">

<div class="card-top">
<div class="icon green">
<i class="fa-solid fa-circle-check"></i>
</div>
</div>

<h2>982</h2>

<p>Healthy Cases</p>

<div class="growth">
+8% This Week
</div>

</div>

<div class="card">

<div class="card-top">
<div class="icon red">
<i class="fa-solid fa-lungs"></i>
</div>
</div>

<h2>272</h2>

<p>Pneumonia Cases</p>

<div class="growth">
+5% Today
</div>

</div>

<div class="card">

<div class="card-top">
<div class="icon orange">
<i class="fa-solid fa-microchip"></i>
</div>
</div>

<h2>96.8%</h2>

<p>AI Accuracy</p>

<div class="growth">
Excellent
</div>

</div>

</div>
