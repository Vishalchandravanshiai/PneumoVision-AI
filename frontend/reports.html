<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PneumoVision AI - Reports</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/dashboard.css">

</head>
<body>

<div class="container-fluid">
<div class="row">

<!-- Sidebar -->
<div class="col-md-2 bg-dark text-white min-vh-100 p-3">

<h3 class="text-center mb-4">
<i class="fa-solid fa-lungs"></i>
PneumoVision
</h3>

<a href="dashboard.html" class="btn btn-dark w-100 text-start mb-2">
<i class="fa-solid fa-house"></i> Dashboard
</a>

<a href="upload.html" class="btn btn-dark w-100 text-start mb-2">
<i class="fa-solid fa-upload"></i> Upload X-ray
</a>

<a href="prediction.html" class="btn btn-dark w-100 text-start mb-2">
<i class="fa-solid fa-brain"></i> Prediction
</a>

<a href="reports.html" class="btn btn-primary w-100 text-start mb-2">
<i class="fa-solid fa-file-medical"></i> Reports
</a>

<a href="analytics.html" class="btn btn-dark w-100 text-start mb-2">
<i class="fa-solid fa-chart-line"></i> Analytics
</a>

<a href="settings.html" class="btn btn-dark w-100 text-start">
<i class="fa-solid fa-gear"></i> Settings
</a>

</div>

<!-- Main Content -->

<div class="col-md-10 p-4">

<div class="d-flex justify-content-between align-items-center mb-4">

<h2>
<i class="fa-solid fa-file-medical text-success"></i>
Patient Reports
</h2>

<a href="dashboard.html" class="btn btn-outline-primary">
Dashboard
</a>

</div>

<!-- Search -->

<div class="card shadow border-0 mb-4">

<div class="card-body">

<div class="row">

<div class="col-md-6">

<input type="text"
class="form-control"
placeholder="Search by Patient Name or ID">

</div>

<div class="col-md-3">

<input type="date"
class="form-control">

</div>

<div class="col-md-3">

<button class="btn btn-primary w-100">

<i class="fa-solid fa-search"></i>

Search

</button>

</div>

</div>

</div>

</div>

<!-- Report Table -->

<div class="card shadow border-0">

<div class="card-header bg-primary text-white">

Report History

</div>

<div class="card-body">

<table class="table table-hover table-bordered align-middle">

<thead class="table-dark">

<tr>

<th>Patient ID</th>

<th>Name</th>

<th>Result</th>

<th>Confidence</th>

<th>Date</th>

<th>View</th>

<th>Download</th>

</tr>

</thead>

<tbody id="reportsTableBody">

<tr>
<td colspan="7" class="text-center">Loading scans...</td>
</tr>

</tbody>

</table>

</div>

</div>

<!-- Statistics -->

<div class="row mt-4">

<div class="col-md-3">

<div class="card bg-primary text-white text-center p-3">

<h5>Total Reports</h5>

<h2 id="totalReportsCount">0</h2>

</div>

</div>

<div class="col-md-3">

<div class="card bg-success text-white text-center p-3">

<h5>Normal</h5>

<h2 id="normalCount">0</h2>

</div>

</div>

<div class="col-md-3">

<div class="card bg-danger text-white text-center p-3">

<h5>Pneumonia</h5>

<h2 id="pneumoniaCount">0</h2>

</div>

</div>

</div>

</div>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/dashboard.js"></script>

</body>
</html>
